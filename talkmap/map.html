<h1>{{ page.title }}</h1>
<p>Interactive map of all the talks I’ve given.</p>

<!-- Map container -->
<div id="map" style="width:100%; height:600px;"></div>

<!-- Leaflet CSS (HTTPS) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<!-- Optional inline CSS to enforce height -->
<style>
  #map { height: 600px !important; width: 100% !important; }
</style>

<!-- Leaflet JS (HTTPS) -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

{% raw %}
<script>
document.addEventListener("DOMContentLoaded", function() {
  // Initialize map
  var map = L.map('map').setView([20, 0], 2); // Global view

  // Add HTTPS-hosted OpenStreetMap tiles
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  // Add a test marker to ensure the map loads
  L.marker([0, 0]).addTo(map).bindPopup("Test marker").openPopup();

  // Add markers from site.talks
  {% for talk in site.talks %}
    {% if talk.latitude and talk.longitude %}
      L.marker([{{ talk.latitude }}, {{ talk.longitude }}])
        .addTo(map)
        .bindPopup("<strong>{{ talk.title | escape }}</strong><br>{{ talk.venue | escape }}");
    {% endif %}
  {% endfor %}

  // Optional: fit map bounds to all markers
  var markers = [];
  {% for talk in site.talks %}
    {% if talk.latitude and talk.longitude %}
      markers.push([{{ talk.latitude }}, {{ talk.longitude }}]);
    {% endif %}
  {% endfor %}
  if (markers.length > 0) {
    map.fitBounds(markers);
  }
});
</script>
{% endraw %}
