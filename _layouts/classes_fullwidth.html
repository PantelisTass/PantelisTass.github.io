---
layout: default
---

<div id="main" role="main" style="max-width:none; padding:40px 20px;">

  <article class="post">
    <header class="post-header">
      <h1 class="post-title">{{ page.title }}</h1>
      {% if page.page_intro %}
        <p class="page-intro">{{ page.page_intro }}</p>
      {% endif %}
    </header>

    <div class="post-content">
      <div class="classes-container">
        {{ content }}
      </div>
    </div>

  </article>
</div>
