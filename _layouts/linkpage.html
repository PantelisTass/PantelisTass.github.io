---
layout: default
---

{% include base_path %}

<script type="text/javascript" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>

<style>
  /* 1. Remove theme restrictions and white patches */
  #main {
    max-width: none !important;
    padding: 0 !important;
    margin: 0 !important;
    width: 100% !important;
    /* Changed to auto so it doesn't force extra white space on short pages */
    min-height: auto !important; 
  }

  /* 2. Style the EXISTING theme footer to be full-width and aligned */
  .page__footer {
    float: left;
    width: 100% !important;
    margin: 0 !important;
    padding: 20px 0 !important;
    border-top: 1px solid #000 !important;
  }

  .page__footer-innerptr {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 20px;
  }

  /* 3. Standard Text Alignment */
  .post-header, .post-content {
    max-width: 1280px;
    margin: 0 auto !important;
    padding: 20px !important;
  }

  .post-header { padding-top: 100px !important; }

  /* 4. Uniform Links */
  .post-content a {
    color: #494e52 !important;
    text-decoration: none !important;
    border-bottom: 1px solid #ccc;
  }
</style>



<div id="main" role="main">
  <article class="post">
    
    <header class="post-header">
      <h1 class="post-title" style="margin: 0; border: none; line-height: 1.1;">{{ page.title }}</h1>
      {% if page.description %}
        <p style="margin-top: 10px; color: #666;">{{ page.description }}</p>
      {% endif %}
      <div style="height: 1px; margin-top: 20px; width: 100%; background: #eee;"></div>
    </header>

    <div class="post-content">
      {% if page.target %}
        <div style="margin-bottom: 30px;">
          <a href="{{ page.target }}" style="font-weight: bold;">Click here to view</a>
        </div>
      {% endif %}

      {% if page.image_link %}
        <figure style="margin: 0 0 30px 0;">
          <a href="{{ page.image_url }}" style="border: none !important;">
            <img src="{{ page.image_link | relative_url }}" style="width: 45%; min-width: 280px; height: auto;">
          </a>
        </figure>
      {% endif %}

      {% if page.extra_html %}
        <div class="extra-content">
          {{ page.extra_html | markdownify }}
        </div>
      {% endif %}
    </div>
  </article>
  
  </div>
