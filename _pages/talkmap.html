<h1>{{ page.title }}</h1>
<p>Interactive map of all the talks I’ve given.</p>

<!-- Leaflet CSS and JS hosted locally -->
<link rel="stylesheet" href="{{ '/assets/vendor/leaflet/leaflet.css' | relative_url }}">
<script src="{{ '/assets/vendor/leaflet/leaflet.js' | relative_url }}"></script>

<style>
  #map {
    height: 600px !important;
    width: 100% !important;
  }
</style>

<div id="main" role="main" style="max-width:none; padding:40px 20px;">
  <article class="post">

    <!-- Map container -->
    <div id="map"></div>

  </article>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

  var map = L.map('map').setView([20, 0], 2);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  const talks = [
    {
      title: "19th Panhellenic conference in mathematical analysis",
      venue: "National Technical University, Athens Greece",
      lat: 37.97849,
      lng: 23.785228
    }
  ];

  talks.forEach(t => {
    L.marker([t.lat, t.lng])
      .addTo(map)
      .bindPopup("<strong>" + t.title + "</strong><br>" + t.venue);
  });

});
</script>
