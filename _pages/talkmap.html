<h1>{{ page.title }}</h1>
<p>Interactive map of all the talks I’ve given.</p>

<div id="map"></div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  #map { height: 600px !important; width: 100% !important; }
</style>

<script>
document.addEventListener("DOMContentLoaded", function() {
  try {
    // Initialize map zoomed out globally
    var map = L.map('map').setView([20, 0], 2);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // Test marker to ensure map renders
    L.marker([0, 0]).addTo(map).bindPopup("Map is working!").openPopup();
  } catch(e) {
    console.error("Leaflet failed to initialize:", e);
  }
});
</script>
