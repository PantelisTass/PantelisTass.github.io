<h1>{{ page.title }}</h1>
<p>Interactive map of all the talks I’ve given.</p>

<div id="map" style="width:100%; height:600px;"></div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function() {
  // Initialize map zoomed out globally
  var map = L.map('map').setView([20, 0], 2); // lat=20, lng=0, zoom=2

  // Add OpenStreetMap tiles over HTTPS
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  // Example talks data
  const talks = [
  { "title": "19th Panhellenic conference in mathematical analysis", "venue": ", National Technical University, Athens Greece", "lat": 37.97849, "lng": 23.785228 }
]

  // Add markers without changing map zoom/center
  talks.forEach(t => {
    L.marker([t.lat, t.lng])
      .addTo(map)
      .bindPopup("<strong>" + t.title + "</strong><br>" + t.venue);
  });

  // No fitBounds → map stays zoomed out
});
</script>
