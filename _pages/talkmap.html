<div id="map" style="width:100%; height:600px;"></div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function() {
  var map = L.map('map').setView([20,0],2);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  const talks = [
  { "title": "19th Panhellenic conference in mathematical analysis", "venue": ", National Technical University, Athens Greece", "lat": 37.97849, "lng": 23.785228 }
]

  var markers = [];
  talks.forEach(t => {
    var marker = L.marker([t.lat, t.lng]).addTo(map)
      .bindPopup("<strong>" + t.title + "</strong><br>" + t.venue);
    markers.push([t.lat, t.lng]);
  });

  if (markers.length > 0) {
    map.fitBounds(markers);
  }
});
</script>
