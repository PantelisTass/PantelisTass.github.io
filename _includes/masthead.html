<style>
/* Target the sticky classes used by the theme */
.masthead.is-sticky, 
.sticky .masthead,
.masthead--fixed {
  position: relative !important; /* Changes it from fixed/sticky back to normal */
  height: auto !important;
  transition: none !important; /* Stop the "morphing" animation */
}

/* Ensure the inner wrap doesn't shrink when sticky */
.masthead.is-sticky .masthead__inner-wrap,
.sticky .masthead__inner-wrap {
  padding: 0 20px !important;
  height: auto !important;
  max-width: none !important;
}

/* 2. Create a "Hardware-Accelerated" border */
.masthead::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: 0;
  width: 100%;
  /* Using 1.5px or 2px can help on high-res mobile screens */
  height: 1px; 
  background-color: #1b1b1b;
  display: block;
  z-index: 10;
}

  .masthead__inner-wrap {
    width: 100% !important;
    max-width: none !important;
    padding: 0 !important;
    margin: 0 !important;
  }

  /* 2. Remove padding from the nav so the JS math stays perfect */
  .greedy-nav {
    display: flex !important;
    width: 100% !important;
    padding: 0 !important; 
    margin: 0 !important;
    overflow: visible !important; /* Ensures the button is never cut off */
  }

  /* 3. Shift the FIRST and LAST items to create the 20px alignment */
  .visible-links {
    display: flex !important;
    flex: 1 !important;
    list-style: none !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  /* Your Name / Site Title (The far left item) */
  .masthead__menu-item--lg {
    padding-left: 20px !important; /* This aligns with your content */
  }
</style>

{% include base_path %}

<div class='masthead'>
  <div class='masthead__inner-wrap'>
    <nav id='site-nav' class='greedy-nav'>
      <ul class='visible-links'>
        <li class='masthead__menu-item masthead__menu-item--lg'>
          <a href='{{ base_path }}/' style='font-weight: bold; text-decoration: none; color: #1b1b1b;'>{{ site.title }}</a>
        </li>
        {% for link in site.data.navigation.main %}
          <li class='masthead__menu-item'>
            <a href='{{ base_path }}{{ link.url }}' style='text-decoration: none; color: #1b1b1b; margin-left: 20px;'>{{ link.title }}</a>
          </li>
        {% endfor %}
      </ul>

      <button class='greedy-nav__toggle hidden' type='button'>
        <div class='navicon'></div>
      </button>

      <ul class='hidden-links hidden'></ul>
    </nav>
  </div>
</div>
